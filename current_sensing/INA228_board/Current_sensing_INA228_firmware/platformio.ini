[env:stm32_FCP_firmware]
platform = ststm32
board = nucleo_l432kc
framework = stmbed
build_flags = -I src/Current_sensing_INA228_firmware/src   
              -I src/Current_sensing_INA228_firmware/lib/INA228/src
              -I src/Current_sensing_INA228_firmware/lib/INA228/src/STM32
              -I src/Current_sensing_INA228_firmware/lib/INA228/src/STM32/STM32L4

